<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="55%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="headGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E0E7FF" />
    </linearGradient>
    <linearGradient id="visorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
    <linearGradient id="eyeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#22D3EE" />
    </linearGradient>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#bgGrad)" />

  <!-- Subtle Inner Glow Border -->
  <rect x="8" y="8" width="112" height="112" rx="26" fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="2" />

  <!-- Antenna Stem -->
  <rect x="61" y="20" width="6" height="14" rx="3" fill="#E0E7FF" />
  <!-- Antenna Tip (Glowing Cyan/Emerald node) -->
  <circle cx="64" cy="17" r="7" fill="#38BDF8" />
  <circle cx="62" cy="15" r="2.5" fill="#E0F2FE" />

  <!-- Left & Right Ears / Side Bolts -->
  <rect x="16" y="54" width="10" height="24" rx="5" fill="#C7D2FE" />
  <rect x="102" y="54" width="10" height="24" rx="5" fill="#C7D2FE" />

  <!-- Robot Head Shell -->
  <rect x="24" y="32" width="80" height="68" rx="20" fill="url(#headGrad)" />

  <!-- Robot Face Visor Screen -->
  <rect x="33" y="44" width="62" height="34" rx="12" fill="url(#visorGrad)" />

  <!-- Glowing Robot Eyes -->
  <circle cx="49" cy="61" r="8" fill="url(#eyeGrad)" />
  <circle cx="79" cy="61" r="8" fill="url(#eyeGrad)" />
  <!-- Eye Highlights -->
  <circle cx="46.5" cy="58.5" r="2.5" fill="#FFFFFF" />
  <circle cx="76.5" cy="58.5" r="2.5" fill="#FFFFFF" />

  <!-- Robot Friendly Smile / Audio Grille -->
  <rect x="48" y="85" width="32" height="6" rx="3" fill="#4F46E5" opacity="0.85" />
  <circle cx="41" cy="88" r="2.5" fill="#6366F1" opacity="0.7" />
  <circle cx="87" cy="88" r="2.5" fill="#6366F1" opacity="0.7" />
</svg>
